<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Karton</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#05100f;--card:#0b1d1d;--line:#15393a;--cy:#22d3ee;--cy2:#67e8f9;--tx:#e6fbfd;--mu:#7fa8ab;--red:#fb7185;--grn:#34d399}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(1200px 600px at 80% -10%,#0a3436 0%,transparent 60%),var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;min-height:100vh}
#loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg);z-index:50;text-align:center;padding:24px}
.ring{width:64px;height:64px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--cy);animation:sp 1s linear infinite;box-shadow:0 0 30px #22d3ee33}
@keyframes sp{to{transform:rotate(360deg)}}
#loader h2{font-family:'Cormorant Garamond',serif;font-size:28px;letter-spacing:2px;color:var(--cy2)}
#lmsg{color:var(--mu);font-size:14px}
#retry{display:none}
.btn{background:linear-gradient(135deg,#0e7490,#22d3ee);color:#041516;border:0;border-radius:10px;padding:11px 18px;font-weight:600;cursor:pointer;font-family:inherit}
.btn.ghost{background:transparent;color:var(--cy2);border:1px solid var(--line)}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:22px clamp(16px,4vw,48px);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-family:'Cormorant Garamond',serif;font-size:28px;letter-spacing:2px;color:var(--cy2)}
.brand small{display:block;font:500 11px Inter;letter-spacing:3px;color:var(--mu);text-transform:uppercase}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--grn);box-shadow:0 0 10px var(--grn);margin-right:6px}
main{padding:24px clamp(16px,4vw,48px);max-width:1200px;margin:auto}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px;width:fit-content;max-width:100%;overflow:auto;margin-bottom:22px}
.tab{background:none;border:0;color:var(--mu);padding:9px 20px;border-radius:8px;cursor:pointer;font:500 14px Inter;white-space:nowrap}
.tab.on{background:#0e3d40;color:var(--cy2);box-shadow:inset 0 0 0 1px #22d3ee55}
.total{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px;flex-wrap:wrap;gap:12px}
.total b{font:600 44px 'Cormorant Garamond',serif;color:var(--cy2);display:block;line-height:1}
.total span{color:var(--mu);font-size:12px;letter-spacing:2px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:linear-gradient(160deg,#0d2527,var(--card));border:1px solid var(--line);border-radius:16px;padding:18px;transition:.2s}
.card:hover{border-color:#22d3ee66;box-shadow:0 0 24px #22d3ee1a}
.card h3{font-size:14px;font-weight:500;color:var(--mu)}
.card .n{font:600 38px 'Cormorant Garamond',serif;margin:6px 0;color:var(--tx)}
.card .sub{font-size:12px;color:var(--mu)}
.low{color:var(--red)!important}
table{width:100%;border-collapse:collapse;font-size:13px}
.wrap{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:auto}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mu);font-weight:500;font-size:11px;letter-spacing:1.5px;text-transform:uppercase}
.tag{padding:3px 10px;border-radius:99px;font-size:11px;border:1px solid var(--line)}
.t-Tambah{color:var(--grn)}.t-Dipakai,.t-NG{color:var(--red)}.t-Transfer{color:var(--cy2)}
.ngrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}.ngrow:last-child{border-bottom:0}.ngrow b{font-weight:500}.ngrow small{display:block;color:var(--mu);font-size:12px;margin-top:3px}.sec{font-size:11px;letter-spacing:2px;color:var(--mu);text-transform:uppercase;margin:22px 0 10px}.ok{color:var(--grn);font-size:12px}.fab{position:fixed;right:22px;bottom:22px;padding:14px 22px;box-shadow:0 8px 30px #22d3ee44}
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:40}
#modal.on{display:flex}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;width:100%;max-width:400px}
.box h2{font:600 24px 'Cormorant Garamond',serif;color:var(--cy2);margin-bottom:14px}
label{display:block;font-size:12px;color:var(--mu);margin:12px 0 5px}
select,input{width:100%;background:#071616;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:11px;font:inherit}
select:focus,input:focus{outline:0;border-color:var(--cy)}
.row{display:flex;gap:10px;margin-top:20px}.row .btn{flex:1}
#err{color:var(--red);font-size:12px;min-height:16px;margin-top:10px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0e3d40;border:1px solid var(--cy);padding:10px 18px;border-radius:10px;display:none;z-index:60;font-size:13px}
</style>
</head>
<body>

<div id="loader">
  <div class="ring" id="ring"></div>
  <h2>STOCK KARTON</h2>
  <div id="lmsg">Menghubungkan ke database…</div>
  <button class="btn" id="retry" onclick="boot()">Coba Lagi</button>
</div>

<div id="app" hidden>
  <header>
    <div class="brand">Stock Karton<small>Export &amp; Warehouse</small></div>
    <div style="font-size:12px;color:var(--mu)"><span class="dot"></span><span id="status">Terhubung</span>
      <button class="btn ghost" style="margin-left:10px;padding:7px 12px" onclick="load(true)">Muat Ulang</button></div>
  </header>
  <main>
    <div class="tabs" id="tabs"></div>
    <div id="view"></div>
  </main>
  <button class="btn fab" onclick="openM()">+ Transaksi</button>
</div>

<div id="modal"><div class="box">
  <h2>Transaksi Baru</h2>
  <label>Jenis</label>
  <select id="jenis" onchange="syncForm()">
    <option>Tambah</option><option>Dipakai</option><option>NG/Rusak</option><option>Transfer</option><option value="Module">1 Module</option>
  </select>
  <label id="areaL">Area</label>
  <select id="area"><option>Warehouse</option><option>Export</option></select>
  <div id="trf" style="display:none;font-size:13px;color:var(--cy2);margin-top:12px">Warehouse → Export</div>
  <label id="itemL">Item</label>
  <select id="item"></select>
  <div id="mod" style="display:none;font-size:12px;color:var(--cy2);margin-top:12px;line-height:1.7;border:1px solid var(--line);border-radius:10px;padding:10px 12px">Mengurangi stock Export per 1 module:<br>Karton 401, 402, 403: 4 pcs masing-masing<br>Inner: 1 &middot; Impraboard Panjang: 4<br>Impraboard Kecil: 12 &middot; Sundry: 12</div>
  <label id="qtyL">Jumlah</label>
  <input id="qty" type="number" min="1" inputmode="numeric" placeholder="0">
  <label>Catatan (opsional)</label>
  <input id="note" placeholder="Keterangan">
  <div id="err"></div>
  <div class="row"><button class="btn ghost" onclick="closeM()">Batal</button><button class="btn" id="save" onclick="submitTx()">Simpan</button></div>
</div></div>
<div id="toast"></div>

<script>
// ====== PENGATURAN ======
// Tempel URL Web App dari Google Apps Script di sini (lihat Code.gs).
// Kosongkan untuk mode demo (data tidak tersimpan).
const API_URL =
"https://script.google.com/macros/s/AKfycbzZ5UMTHSkgiBNi6CapA21XBQBge1eblXnAM-kxgM5MKw9OaOoHidyWnjcM51Qj7IE/exec";
// ========================

const ITEMS = ["Karton 401","Karton 402","Karton 403","Sundry","Inner","Impraboard Panjang","Impraboard Kecil","Plastik 01&02","Plastik 03&04"];
const AREAS = ["Export","Warehouse"];
const MODULE = {"Karton 401":4,"Karton 402":4,"Karton 403":4,"Inner":1,"Impraboard Panjang":4,"Impraboard Kecil":12,"Sundry":12};
let TX = [], NG = [], tab = "Export";

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function fetchTx(){
  if(!API_URL){ await sleep(900); return {tx:TX, ng:NG}; }
  const r = await fetch(API_URL);
  const d = await r.json();
  if(!d.ok) throw new Error("Respon tidak valid");
  return {tx:d.tx, ng:d.ng||[]};
}
async function postTx(o){
  if(!API_URL){ await sleep(400); return; }
  const r = await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Array.isArray(o)?{batch:o}:o)});
  const d = await r.json();
  if(!d.ok) throw new Error("Gagal menyimpan");
}

async function boot(){
  $("retry").style.display = "none";
  $("ring").style.display = "block";
  $("lmsg").textContent = "Menghubungkan ke database…";
  try{
    { const d = await fetchTx(); TX = d.tx; NG = d.ng; }
    $("lmsg").textContent = "Terhubung. Membuka aplikasi…";
    await sleep(500);
    $("loader").style.display = "none";
    $("app").hidden = false;
    $("status").textContent = API_URL ? "Terhubung" : "Mode Demo";
    render();
  }catch(e){
    $("ring").style.display = "none";
    $("lmsg").textContent = "Gagal terhubung ke database. Periksa URL dan koneksi.";
    $("retry").style.display = "inline-block";
  }
}
async function load(manual){
  $("status").textContent = "Memuat…";
  try{ { const d = await fetchTx(); TX = d.tx; NG = d.ng; } $("status").textContent = API_URL ? "Terhubung" : "Mode Demo"; render(); if(manual) toast("Data diperbarui"); }
  catch(e){ $("status").textContent = "Gagal memuat"; }
}

function stock(){
  const s = {Export:{},Warehouse:{}};
  AREAS.forEach(a => ITEMS.forEach(i => s[a][i] = 0));
  TX.forEach(t => {
    if(!ITEMS.includes(t.item)) return;
    const q = Number(t.qty)||0;
    if(t.jenis === "Tambah") s[t.area][t.item] += q;
    else if(t.jenis === "Dipakai" || t.jenis === "NG/Rusak") s[t.area][t.item] -= q;
    else if(t.jenis === "Transfer"){ s.Warehouse[t.item] -= q; s.Export[t.item] += q; }
  });
  return s;
}

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const fmt = v => { const d = new Date(v); return isNaN(d) ? v : d.toLocaleString("id-ID",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}); };
function ngList(){
  const all = [...NG].reverse();
  return {pending: all.filter(n => n.status !== "Sudah Diganti"), done: all.filter(n => n.status === "Sudah Diganti")};
}
async function replaced(id){
  const n = NG.find(t => t.id === id);
  if(!n || n.status === "Sudah Diganti" || !confirm(`Tandai ${n.qty} ${n.item} sudah diganti? Stock Warehouse akan bertambah ${n.qty}.`)) return;
  const tx = {item:n.item, jenis:"Tambah", area:"Warehouse", qty:n.qty, note:"Pengganti NG/Rusak", id:uid(), ref:id};
  try{
    await postTx({action:"replace", id, newId:tx.id});
    n.status = "Sudah Diganti";
    TX.push({...tx, t:new Date().toISOString()});
    render(); toast("Masuk ke stock Warehouse");
  }catch(e){ toast("Gagal menyimpan, muat ulang data"); }
}
function render(){
  const ng = ngList();
  $("tabs").innerHTML = ["Export","Warehouse","NG/Rusak","Riwayat"].map(t =>
    `<button class="tab ${t===tab?"on":""}" onclick="tab='${t}';render()">${t}${t==="NG/Rusak"&&ng.pending.length?` (${ng.pending.length})`:""}</button>`).join("");
  const s = stock();
  if(tab === "Riwayat"){
    const rows = [...TX].reverse().slice(0,200).map(t => {
      const d = new Date(t.t);
      const w = isNaN(d) ? t.t : d.toLocaleString("id-ID",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
      const k = t.jenis.split("/")[0];
      const ar = t.jenis === "Transfer" ? "Warehouse → Export" : t.area;
      return `<tr><td>${w}</td><td>${t.item}</td><td><span class="tag t-${k}">${t.jenis}</span></td><td>${ar}</td><td>${t.qty}</td><td>${t.note||""}</td></tr>`;
    }).join("");
    $("view").innerHTML = `<div class="wrap"><table><tr><th>Waktu</th><th>Item</th><th>Jenis</th><th>Area</th><th>Jumlah</th><th>Catatan</th></tr>${rows || '<tr><td colspan="6" style="color:var(--mu)">Belum ada transaksi</td></tr>'}</table></div>`;
    return;
  }
  if(tab === "NG/Rusak"){
    const row = (t,done) => `<div class="ngrow"><div><b>${t.item} &middot; ${t.qty} pcs</b><small>Dari ${t.area} &middot; ${fmt(t.t)}${t.note?" &middot; "+t.note:""}</small></div>${done?'<span class="ok">Sudah diganti</span>':`<button class="btn" onclick="replaced('${t.id}')">Sudah Diganti</button>`}</div>`;
    $("view").innerHTML = `<div class="sec">Menunggu penggantian (${ng.pending.length})</div><div class="wrap">${ng.pending.map(t=>row(t,false)).join("")||'<div class="ngrow" style="color:var(--mu)">Tidak ada NG/Rusak yang menunggu</div>'}</div>
    <div class="sec">Sudah diganti</div><div class="wrap">${ng.done.map(t=>row(t,true)).join("")||'<div class="ngrow" style="color:var(--mu)">Belum ada</div>'}</div>`;
    return;
  }
  const other = tab === "Export" ? "Warehouse" : "Export";
  $("view").innerHTML = "" + `
  <div class="grid">${ITEMS.map(i => `<div class="card"><h3>${i}</h3><div class="n ${s[tab][i]<=0?"low":""}">${s[tab][i].toLocaleString("id-ID")}</div><div class="sub">${other}: ${s[other][i].toLocaleString("id-ID")}</div><div class="sub" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line);color:var(--cy2)">Total stock: <b>${(s.Export[i]+s.Warehouse[i]).toLocaleString("id-ID")}</b></div></div>`).join("")}</div>`;
}

function openM(){
  $("item").innerHTML = ITEMS.map(i => `<option>${i}</option>`).join("");
  $("area").value = tab === "Riwayat" ? "Warehouse" : tab;
  $("qty").value = ""; $("note").value = ""; $("err").textContent = "";
  syncForm(); $("modal").classList.add("on");
}
function closeM(){ $("modal").classList.remove("on"); }
function syncForm(){
  const j = $("jenis").value, tr = j === "Transfer", mo = j === "Module";
  $("area").style.display = $("areaL").style.display = (tr || mo) ? "none" : "block";
  $("item").style.display = $("itemL").style.display = mo ? "none" : "block";
  $("trf").style.display = tr ? "block" : "none";
  $("mod").style.display = mo ? "block" : "none";
  $("qtyL").textContent = mo ? "Jumlah module" : "Jumlah";
}
async function submitTx(){
  const jenis = $("jenis").value, item = $("item").value, qty = parseInt($("qty").value,10);
  const area = jenis === "Transfer" ? "Warehouse → Export" : $("area").value;
  if(!qty || qty < 1){ $("err").textContent = "Jumlah harus lebih dari 0."; return; }
  if(jenis === "Module"){
    const ex = stock().Export, short = [];
    Object.entries(MODULE).forEach(([i,p]) => { if(ex[i] < p*qty) short.push(`${i} (butuh ${p*qty}, ada ${ex[i]})`); });
    if(short.length){ $("err").textContent = "Stock Export kurang: " + short.join(", "); return; }
    const nt = `Module x${qty}` + ($("note").value.trim() ? " - " + $("note").value.trim() : "");
    const rows = Object.entries(MODULE).map(([i,p]) => ({item:i, jenis:"Dipakai", area:"Export", qty:p*qty, note:nt, id:uid()}));
    $("save").disabled = true; $("save").textContent = "Menyimpan…";
    try{
      await postTx(rows);
      const now = new Date().toISOString();
      rows.forEach(r => TX.push({...r, t:now}));
      closeM(); render(); toast(`${qty} module tercatat`);
    }catch(e){ $("err").textContent = "Gagal menyimpan. Coba lagi."; }
    $("save").disabled = false; $("save").textContent = "Simpan";
    return;
  }
  const s = stock();
  const src = jenis === "Transfer" ? "Warehouse" : $("area").value;
  if(jenis !== "Tambah" && s[src][item] < qty){ $("err").textContent = `Stock ${src} tidak cukup (tersedia ${s[src][item]}).`; return; }
  const tx = {item, jenis, area, qty, note: $("note").value.trim(), id: uid()};
  $("save").disabled = true; $("save").textContent = "Menyimpan…";
  try{
    await postTx(tx);
    TX.push({...tx, t: new Date().toISOString()});
    if(jenis === "NG/Rusak") NG.push({id:tx.id, t:new Date().toISOString(), item, area, qty, note:tx.note, status:"Menunggu"});
    closeM(); render(); toast("Transaksi tersimpan");
  }catch(e){ $("err").textContent = "Gagal menyimpan. Coba lagi."; }
  $("save").disabled = false; $("save").textContent = "Simpan";
}
function toast(m){ const t=$("toast"); t.textContent=m; t.style.display="block"; setTimeout(()=>t.style.display="none",2200); }

boot();
</script>
</body>
</html>
